name: Security SAST

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

env:
  CI: 'true'

jobs:
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 10.33.4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run npm audit (supply chain)
        run: pnpm audit --production --audit-level=high || true
      - name: Run script audit rules
        run: node scripts/audit.mjs
      - name: Run umbrella audit validate
        run: node scripts/umbrella-audit.mjs --validate || true
